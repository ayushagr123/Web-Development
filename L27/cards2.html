<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      margin:0px;
      padding:0px;
    }
    .container{
      height:100vh;
      width:100vw;
      background-color: rgb(163, 228, 207);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .box{
      width:350px;
      height:500px;
      border:1px solid black;
      background-color: white;
      display:flex;
      flex-direction:column;
      gap:30px;
      padding-bottom:40px;
      border-radius:10px;
      box-shadow:1px 1px 6px 2px rgb(97, 97, 97);
    }
    .top{
      width:100%;
      height:30%;
    }
    .top img{
      width:100%;
      height:100%;
      object-fit:cover;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }
    .icon img{
      width:30px;
      height:30px;
    }
    .bottom{
      width:100%;
      height:70%;
      display:flex;
      flex-direction:column;
    }
    .box1{
      width:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
    }
    span{
      width:80%;
    }
    .box2{
      width:80%;
      height:40px;
      background-color: rgb(163, 228, 207);
      margin:auto;
      display:flex;
      overflow:none;
      align-items:center;
      padding:10px;
      border-radius:10px;
      margin-top:15px;
    }
    .rate{
      gap:5px;
    }
    h2{
      margin-bottom:20px;
    }
    .icon{
      margin-right:8px;
    }
    a{
      margin-left:40%;
      padding-right:30px;
    }
    .rate p{
      width:80px;
    }
    .box3{
      display:flex;
      flex-direction:column;
      gap:25px;
    }
    .box3 button{
      width:80%;
      margin:auto;
      padding:15px;
      margin-top:20px;
      border-radius:5px;
      background-color:rgb(0, 0, 75);
      color:white;
      box-shadow:0px 8px 10px 1px rgb(44, 41, 41);
    }
    .box3 a{
      text-decoration:none;
      color:black;
    }
  </style>
</head>
<body>
    <div class="container">
      <div class="box">
        <div class="top">
          <img src="image.jpeg" alt="image">
        </div>
        <div class="bottom">
          <div class="box1">
            <h2>Order Summary</h2>
            <span>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Veniam aliquam velit laudantium repellat? Doloremque optio velit consequatur magnam debitis recusandae.
            </span>
          </div>
          <div class="box2">
            <div class="icon"><img src="music.png" alt=""></div>
            <div class="rate">
              <p>Annual Plan</p>
              <p>$99.9/year</p>
            </div>
            <a href="#">Change</a>
          </div>
          <div class="box3">
            <button>Proceed for Payment</button>
            <a href="#">Cancel Order</a>
          </div>
        </div>
      </div>
    </div>
</body>
</html>
