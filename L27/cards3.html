<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    p{
      color:white;
    }
    *{
      margin:0px;
      padding:0px;
      box-sizing:border-box;
    }
    .container{
      height:100vh;
      width:100vw;
      background-color: rgb(24, 82, 135);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .leftBox{
      width:50%;
      padding:40px;
      display:flex;
      flex-direction:column;
      gap:30px;
    }
    .rightBox{
      width:50%;
      height: 100%;
    }
    .rightBox img{
      width:100%;
      height: 100%;
    }
    .card{
      width:700px;
      height:350px;
      background-color: rgb(68, 1, 68);
      display:flex;
    }
    .stats{
      display:flex;
      justify-content:space-between;
      margin-top:10px;
      margin-bottom:20px;
    }
    h2{
      color:white;
      font-size:1.8rem;
    }
    h3{
      color:white;
    }
    .content p{
      width:300px;
    }
  </style>
</head>
  <div class="container">
    <div class="card">
      <div class="leftBox">
        <div class="heading">
          <h2>Get insights that help your business grow</h2>
        </div>
        <div class="content">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nulla tenetur cum voluptates ipsam sit nisi recusandae ab repellendus, reprehenderit error.</p>
        </div>
        <div class="stats">
          <div class="comment">
            <h3>10K+</h3>
            <p>Comments</p>
        </div>
          <div class="users">
            <h3>214</h3>
            <p>Paid Users</p>
          </div>
          <div class="views">
            <h3>12M+</h3>
            <p>Views</p>
          </div>
        </div>
      </div>
      <div class="rightBox">
        <img src="image.jpeg" alt="img">
      </div>
    </div>
  </div>
</body>
</html>
