<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .container{
    width:100vw;
    height:100vh;
    background: #ffebeb;
    background: radial-gradient(circle, rgba(255, 235, 235, 1) 0%, rgba(148, 187, 233, 1) 100%);
    display:flex;
    justify-content:center;
    align-items:center;
  }
  .box{
    width:300px;
    height:400px;
    background-color: white;;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
  }
  img{
    width:180px;
    height:190px;
  }
  .bottom{
    padding:12px;
  }
  .bottom h2{
    font-weight:bold;
    font-size:1.8rem;
  }
  .top{
    padding-top:40px;

  }  </style>
<body>
  <div class="container">
    <div class="box">
      <div class="top">
        <img src="qr.jpg" alt="qr code">
      </div>
      <div class="bottom">
        <h2>Frontend</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Tenetur aliquid doloremque debitis.</p>
      </div>
    </div>

  </div>
</body>
</html>
