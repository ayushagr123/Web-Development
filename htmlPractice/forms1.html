<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

    <br/>

    <br/>

    <br/>
    <br/>

    <input type="submit" value="Register">
