<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <form>
    <h2>Job Application</h2>
    <label for="name">Name:</label>
    <br/>
    <br/>
    <input type="text" name="name" id="name">
    <br/>
    <label for="email">Email:</label>
    <br/>
    <br/>
    <input type="email" name="email" id="email">
    <br/>
    <label for="phoneNo">Phone:</label>
    <br/>
    <br/>
    <input type="tel" name="phoneNo" id="phoneNo">
    <br/>
    <label for="resume">Resume:</label>
    <br/>
    <br/>
    <input type="file" name="resume" id="resume">
    <br/>
    <label for="exp">Experience(years):</label>
    <br/>
    <br/>
    <input type="number" id="exp" name="exp" min="0" max="50">
    <br/>
    <fieldset>
      <legend>Skills:</legend>
      <label for="html">HTML</label>
      <br/>
      <input type="checkbox" id="html" name="html">
      <br/>
      <label for="css">CSS</label>
      <br/>
      <input type="checkbox" id="css" name="css">
      <br/>
      <label for="js">JavaScript</label>
      <br/>
      <input type="checkbox" id="js" name="js">
      <br/>

    </fieldset>
    <br/>
    <label for="education">Hishest Education:</label>
    <select name="education" id="education">
       <option value="option1">HighSchool</option>
       <option value="option2">Intermediate</option>
       <option value="option3">Graduate</option>
    </select>
    <br/>
    <fieldset>
      <legend>Availability:</legend>
      <input type="checkbox" id="fulltime" name="fulltime">
      <br/>
      <label for="fulltime">Fulltime</label>
      <br/>
      <input type="checkbox" id="part-time" name="part-time">
      <br/>
      <label for="part-time">Part-time</label>
      <br/>
      <br/>
    </fieldset>
    <label for="comments">Additional Comments:</label>
    <br/>
    <br/>
    <textarea name="comments" id="comments" rows="5" cols="50"></textarea>
    <input type="submit" value="submit">
   
  </form>
</body>
</html>
