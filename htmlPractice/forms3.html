<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h2>Complex Form</h2>
  <fieldset>
    <legend>Personal Information</legend>
     <label for="name">Name:</label>
    <input type="text" name="name" id="name">
    <label for="email">Email:</label>
    <input type="email" name="email" id="email">
    <label for="phoneNo">Phone:</label>
    <input type="tel" name="phoneNo" id="phoneNo">
    <label for="datepicker">DAte of Birth:</label>
    <input type="date" name="datepicker" id="datepicker">
    <p style="display:inline">Gender</p>
    <input type="radio" id="male" name="male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="female">
    <label for="female">Female</label>
    <label for="country">Country:</label>
    <select name="country" id="country">
      <option value="us">US</option>
      <option value="India">India</option>
    </select>
    
  </fieldset>
  <fieldset>
    <legend>Address</legend>
    <label for="street">Street</label>
    <input type="text" id="street" name="street">
    <label for="city">City:</label>
    <input type="text" name="city" id="city">
    <label for="state">State:</label>
    <input type="text" name="state" id="state">
    <label for="zipcode">Zipcode:</label>
    <input type="tel" name="zipcode" id="zipcode">
  </fieldset>
  <fieldset>
    <legend>Other Information</legend>
    <label for="comments">Comments</label>
    <textarea name="comments" id="comments" rows="5" cols="50"></textarea>
    
    <label for="checkbox">I agree to the terms of service</label>
    <input type="checkbox" id="agree" name="agree">
  </fieldset>
  <input type="submit" value="submit">
</body>
</html>
